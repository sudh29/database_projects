name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  unit-tests:
    name: Unit Tests & Audits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "02-cache-redis/package-lock.json"

      - name: Install Node dependencies
        run: |
          cd 02-cache-redis
          npm ci

      - name: Run unified multi-paradigm test suite
        run: make test

      - name: Run dependency security audit
        run: |
          cd 02-cache-redis
          npm audit --audit-level=high

  containerized-integration:
    name: Containerized Service Integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      mongo:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary pymongo
          cd 02-cache-redis && npm ci

      - name: Initialize PostgreSQL schema
        run: |
          PGPASSWORD=password psql -h localhost -U postgres -d postgres -f 01-relational-postgres/docker/init.sql

      - name: Seed MongoDB
        run: |
          python 03-document-mongodb/src/catalog_service.py

      - name: Run live integration verifications
        run: |
          python 01-relational-postgres/src/money_club_sol.py
          python 01-relational-postgres/src/queries.py
          python 03-document-mongodb/src/aggregation_demo.py
          node 02-cache-redis/src/dataStructuresDemo.js

